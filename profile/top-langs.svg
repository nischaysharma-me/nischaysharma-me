<svg width="340" height="165" viewBox="0 0 340 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most used languages">
  <title>Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #E57373; }
    .lang-name { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="339" height="164" fill="#161616" stroke="#E57373"/>
  <g transform="translate(25, 35)">
    <text class="header" x="0" y="0">Most Used Languages</text>
  </g>
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="250" height="8" rx="4" fill="#30363d"/>
    <svg x="0" y="0" width="250" height="8">
      <defs>
        <clipPath id="lang-bar"><rect x="0" y="0" width="250" height="8" rx="4"/></clipPath>
      </defs>
      <g clip-path="url(#lang-bar)">
        <rect x="0.00" y="0" width="136.70" height="8" fill="#3178c6"/><rect x="136.70" y="0" width="57.63" height="8" fill="#3572A5"/><rect x="194.33" y="0" width="22.90" height="8" fill="#f1e05a"/><rect x="217.23" y="0" width="19.52" height="8" fill="#e34c26"/><rect x="236.75" y="0" width="8.70" height="8" fill="#3D6117"/><rect x="245.46" y="0" width="4.54" height="8" fill="#c6538c"/>
      </g>
    </svg>
  </g>
  <g transform="translate(25, 80)"><g transform="translate(0, 0)">
        <circle cx="5" cy="6" r="5" fill="#3178c6"/>
        <text class="lang-name" x="16" y="10">TypeScript 54.68%</text>
      </g><g transform="translate(0, 25)">
        <circle cx="5" cy="6" r="5" fill="#3572A5"/>
        <text class="lang-name" x="16" y="10">Python 23.05%</text>
      </g><g transform="translate(0, 50)">
        <circle cx="5" cy="6" r="5" fill="#f1e05a"/>
        <text class="lang-name" x="16" y="10">JavaScript 9.16%</text>
      </g></g>
  <g transform="translate(175, 80)"><g transform="translate(0, 0)">
        <circle cx="5" cy="6" r="5" fill="#e34c26"/>
        <text class="lang-name" x="16" y="10">HTML 7.81%</text>
      </g><g transform="translate(0, 25)">
        <circle cx="5" cy="6" r="5" fill="#3D6117"/>
        <text class="lang-name" x="16" y="10">TeX 3.48%</text>
      </g><g transform="translate(0, 50)">
        <circle cx="5" cy="6" r="5" fill="#c6538c"/>
        <text class="lang-name" x="16" y="10">SCSS 1.82%</text>
      </g></g>
